name: keep-warm

# Pings the live demo every 10 minutes during judging (Nov 28 to Dec 16, UTC dates) so the free
# Render instance does not fall asleep. A failed request fails the run and GitHub emails the repo owner.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping the demo during the judging window
        shell: bash
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          today=$(date -u +%Y-%m-%d)
          if [[ "$FORCE" != "true" && ( "$today" < "2026-11-28" || "$today" > "2026-12-16" ) ]]; then
            echo "Outside the judging window ($today): nothing to do."
            exit 0
          fi
          for path in healthz legacy/ shop/; do
            curl -fsS --retry 3 --retry-delay 20 --max-time 120 -o /dev/null -w "$path %{http_code} %{time_total}s\n" "https://cutover.onrender.com/$path"
          done
